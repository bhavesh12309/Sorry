<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b16;
    --indigo:#5b6cff;
    --teal:#2dd4bf;
    --amber:#ffcf8a;
    --text:#f3f6ff;
    --muted:#a9b4d0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:grid;place-items:center;
    background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    padding:24px;overflow:hidden;
  }

  /* Background */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5;animation:drift 24s ease-in-out infinite alternate}
  .b1{width:46vmax;height:46vmax;background:var(--indigo);top:-18%;left:-12%}
  .b2{width:38vmax;height:38vmax;background:var(--teal);bottom:-22%;right:-10%;opacity:.35;animation-duration:28s;animation-delay:-8s}
  .b3{width:26vmax;height:26vmax;background:var(--amber);top:40%;left:50%;opacity:.16;animation-duration:32s;animation-delay:-14s}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(6vmax,-4vmax) scale(1.12)}
    100%{transform:translate(-5vmax,5vmax) scale(.95)}
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Slow ripples */
  .ripples{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
  .ripples i{
    position:absolute;width:30vmin;height:30vmin;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    opacity:0;animation:ripple 9s ease-out infinite;
  }
  .ripples i:nth-child(2){animation-delay:3s}
  .ripples i:nth-child(3){animation-delay:6s}
  @keyframes ripple{
    0%{transform:scale(.6);opacity:0}
    15%{opacity:.5}
    100%{transform:scale(3.6);opacity:0}
  }

  /* Content */
  .stage{position:relative;z-index:2;text-align:center;max-width:760px;width:100%}

  .kicker{
    font-size:.8rem;letter-spacing:.42em;text-transform:uppercase;
    color:var(--muted);font-weight:400;
    animation:fadeUp 1s .2s both;
  }

  h1{
    margin-top:0;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(4.2rem,20vw,10rem);
    line-height:.95;letter-spacing:-.02em;
    background:linear-gradient(100deg,#fff 10%,#c9d3ff 40%,var(--teal) 70%,#fff 100%);
    background-size:240% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:fadeUp 1.1s .45s both, shimmer 8s linear 1.6s infinite;
  }
  @keyframes shimmer{to{background-position:-240% 0}}

  .name{
    margin-top:10px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:500;
    font-size:clamp(2.2rem,9vw,4.2rem);
    color:var(--amber);
    min-height:1.2em;
  }
  .name span{
    display:inline-block;opacity:0;
    animation:letter .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes letter{
    from{opacity:0;transform:translateY(22px);filter:blur(6px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }

  .line{
    width:70px;height:1px;margin:30px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:grow 1.2s 1.4s both;
  }
  @keyframes grow{from{width:0;opacity:0}to{width:70px;opacity:1}}

  /* Change name */
  .edit{margin-top:34px;min-height:52px;animation:fadeUp 1s 1.8s both}
  .chip{
    font:400 .85rem 'Inter',sans-serif;letter-spacing:.06em;
    color:var(--muted);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    padding:11px 22px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .35s cubic-bezier(.2,.8,.2,1);
  }
  .chip:hover{color:#fff;border-color:rgba(255,255,255,.35);transform:translateY(-2px);background:rgba(255,255,255,.1)}

  .form{
    display:none;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
  }
  .editing .chip{display:none}
  .editing .form{display:flex;animation:fadeUp .5s both}

  .form input{
    width:min(240px,60vw);
    padding:12px 20px;font:400 1rem 'Inter',sans-serif;color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);
    border-radius:999px;outline:none;text-align:center;
    transition:border-color .3s, box-shadow .3s;
  }
  .form input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,212,191,.15)}
  .form input::placeholder{color:var(--muted)}
  .go{
    padding:12px 24px;font:500 .9rem 'Inter',sans-serif;letter-spacing:.03em;
    color:#04101a;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(120deg,var(--amber),var(--teal));
    box-shadow:0 12px 30px -10px rgba(45,212,191,.6);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .go:hover{transform:translateY(-2px)}
  .go:active{transform:scale(.96)}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
    .ripples{display:none}
  }
</style>
</head>
<body>

  <div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grain"></div>
  <div class="ripples"><i></i><i></i><i></i></div>

  <main class="stage" id="stage">
    <h1>Sorry</h1>
    <div class="name" id="name" aria-live="polite"></div>
    <div class="line"></div>

    <div class="edit">
      <button class="chip" id="open">Change name</button>
      <form class="form" id="form" autocomplete="off">
        <input id="input" type="text" maxlength="24" placeholder="Type a name" aria-label="Name">
        <button class="go" type="submit">Update</button>
      </form>
    </div>
  </main>

<script>
  const nameEl = document.getElementById('name');
  const stage  = document.getElementById('stage');
  const input  = document.getElementById('input');
  const DEFAULT = 'Vanshika';

  function clean(s){ return (s || '').trim().replace(/\s+/g,' ').slice(0,24); }

  function render(n){
    nameEl.innerHTML = '';
    [...n].forEach((ch,i)=>{
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.animationDelay = (0.9 + i*0.07) + 's';
      nameEl.appendChild(s);
    });
    document.title = 'Sorry, ' + n;
  }

  // Priority: ?name= in link, then saved name, then default
  let current = DEFAULT;
  try{
    const q = clean(new URLSearchParams(location.search).get('name'));
    const saved = clean(localStorage.getItem('sorry-name'));
    current = q || saved || DEFAULT;
  }catch(e){}
  render(current);

  document.getElementById('open').addEventListener('click', ()=>{
    stage.classList.add('editing');
    input.value = current;
    input.focus(); input.select();
  });

  document.getElementById('form').addEventListener('submit', e=>{
    e.preventDefault();
    const n = clean(input.value);
    if(n){
      current = n;
      try{ localStorage.setItem('sorry-name', n); }catch(e){}
      render(n);
    }
    stage.classList.remove('editing');
  });

  input.addEventListener('keydown', e=>{
    if(e.key === 'Escape') stage.classList.remove('editing');
  });
</script>
</body>
</html>
